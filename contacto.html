<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Luca Ricompensa</title>
  <meta name="description" content="Ponte en contacto con Luca Ricompensa para consultas y contrataciones.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <style>
    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      padding: 60px var(--gutter);
      max-width: 1200px;
      margin: 0 auto;
      align-items: center;
      min-height: calc(100vh - var(--header-h));
    }
    .contact-info {
      display: flex;
      flex-direction: column;
    }
    .contact-info h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .contact-info p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--ink-soft);
      margin-bottom: 50px;
      max-width: 450px;
    }
    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .contact-details a, .contact-details span {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.3s ease;
    }
    .contact-details a:hover {
      color: var(--ink-soft);
    }
    
    .contact-form {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .form-group {
      margin-bottom: 35px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 10px;
      color: var(--ink-soft);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      font-family: var(--font-sans);
      font-size: 1.05rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.3s ease;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-bottom-color: var(--ink);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    .submit-btn {
      background: var(--ink);
      color: var(--bg);
      padding: 18px 35px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      border: 1px solid var(--ink);
      transition: background 0.3s ease, color 0.3s ease;
      align-self: flex-start;
      margin-top: 10px;
    }
    .submit-btn:hover {
      background: transparent;
      color: var(--ink);
    }

    @media (max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
        padding: 40px var(--gutter);
        gap: 50px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="primary-nav">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" id="primary-nav" aria-label="Navegación principal">
        <a href="index.html#trabajos">Trabajos</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>

    <a href="index.html" class="logo">Luca Ricompensa</a>

    <div class="header-icons">
      <a href="https://instagram.com/lucaricompensa.ph" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.4" cy="6.6" r="0.9" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <!-- Enlace corregido en el header -->
      <a href="mailto:lucmanph@gmail.com" aria-label="Enviar correo electrónico">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2.5" y="5" width="19" height="14" rx="1.5"/>
          <path d="M3.5 6.5 12 13 20.5 6.5"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section class="contact-container">
      <div class="contact-info">
        <h1>Contacto</h1>
        <p>Si tenés un proyecto audiovisual en mente, querés consultar por coberturas deportivas o simplemente saludar, escribime y nos ponemos en contacto.</p>
        
        <div class="contact-details">
          <!-- Enlace corregido en el texto principal -->
          <a href="mailto:lucmanph@gmail.com">lucmanph@gmail.com</a>
          <a href="https://instagram.com/lucaricompensa.ph" target="_blank" rel="noopener noreferrer">@lucaricompensa.ph</a>
          <span>Córdoba, Argentina</span>
        </div>
      </div>
      
      <form class="contact-form" action="https://formspree.io/f/TU_CODIGO_AQUI" method="POST">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre o el de tu marca">
        </div>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@correo.com">
        </div>
        
        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" required placeholder="Contame sobre tu proyecto..."></textarea>
        </div>
        
        <button type="submit" class="submit-btn">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
